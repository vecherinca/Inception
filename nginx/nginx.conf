worker_processes 1;

events {
    worker_connections 1024;
}

http {

    server {
        # Listen on port 443 for HTTPS (IPv4 and IPv6)
        listen              443 ssl;
        listen       [::]:443 ssl;
        server_name         mklimina.42.fr;  

        # SSL certificate configuration
        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The root directory for your site files
	    root  /var/www/html/wordpress/;
	    index index.php index.html;
        location / {
            try_files $uri $uri/ =404;
        }

        # PHP handling (e.g., for WordPress)
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;  # Upstream container or socket
            fastcgi_param HTTPS on;
       	}

        # Log files (optional, but useful for debugging)
        access_log  /var/log/nginx/access.log;
        error_log   /var/log/nginx/error.log;
    }
}
